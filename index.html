<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0e"><meta name="description" content="Кагарлик Моніторинг — карта повітряних тривог України"><title>Кагарлик | Карта загроз</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b0e;color:#e8edf3;font:13px system-ui,-apple-system,Segoe UI,sans-serif}#liveMapFrame,#regionMap{position:absolute;inset:0;width:100%;height:100%!important;background:#090b0e}.leaflet-container{background:#090b0e!important}.leaflet-control-attribution{background:#121518bb!important;color:#a0a9b5!important}.leaflet-control-zoom a{background:#171c23!important;color:#fff!important;border-color:#39404b!important}.mapAlertOverlay{position:absolute;z-index:750;top:16px;left:16px;display:flex;gap:10px;align-items:center;max-width:270px;background:#0d1015e8;border:1px solid #30343b;border-left:3px solid #8795a8;border-radius:12px;padding:12px 15px;box-shadow:0 5px 22px #0007}.mapAlertDot{height:9px;width:9px;border-radius:50%;background:#8795a8;flex:none}.mapAlertOverlay strong{font-size:12px;display:block}.mapAlertOverlay small{display:block;color:#9ba5b2;font-size:10px;margin-top:5px}.mapAlertOverlay:empty{display:none}.topRight{position:absolute;z-index:750;top:16px;right:16px;background:#0d1015e8;border:1px solid #30343b;border-radius:12px;padding:13px 15px;font-weight:700;font-size:12px}.topRight a{color:#e5b43c;text-decoration:none}.bottomNav{position:absolute;z-index:750;bottom:17px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:12px 18px;border:1px solid #30343b;border-radius:14px;background:#0d1015ed;box-shadow:0 4px 24px #0008}.bottomNav a{color:#e2e6ed;text-decoration:none;font-size:11px;font-weight:800;white-space:nowrap}.bottomNav a:first-child{color:#ffbb32}.bottomNav span{height:18px;border-left:1px solid #3b4048}.ukMapLegend{background:#0d1015e8!important;color:#b9c3ce!important;border:1px solid #30343b!important;border-radius:9px!important;padding:9px 11px!important;font-size:11px!important}.cityNameLabel,.mainCityLabel{background:transparent!important;border:0!important;box-shadow:none!important;color:#bdc5cf!important;text-shadow:0 1px 4px #000!important;font-weight:600!important}.mainCityLabel{color:#ffca42!important;font-weight:800!important}.cityNameLabel:before,.mainCityLabel:before{display:none!important}.hiddenStatus{display:none}@media(max-width:600px){.mapAlertOverlay{top:9px;left:9px;padding:9px;max-width:200px}.topRight{top:9px;right:9px;padding:9px}.bottomNav{bottom:12px;gap:11px;padding:11px}.bottomNav a{font-size:10px}}</style></head><body><div id="liveMapFrame"><div id="regionMap" role="application" aria-label="Карта повітряних тривог України"></div><div id="mapAlertOverlay" class="mapAlertOverlay"><i id="mapAlertDot" class="mapAlertDot"></i><div><strong id="mapAlertText">Оновлення статусу…</strong><small>Кагарлик · Обухівський район</small></div></div></div><div class="topRight">КАГАРЛИК · <a href="https://t.me/kagarlykshaheds" target="_blank" rel="noopener">КАНАЛ ↗</a></div><nav class="bottomNav"><a href="https://map.ukrainealarm.com/" target="_blank" rel="noopener">◉ ТРИВОГИ</a><span></span><a href="https://t.me/kagarlykshaheds" target="_blank" rel="noopener">✈ КАНАЛ</a><span></span><a href="https://tryvoha.online/" target="_blank" rel="noopener">ⓘ ДЖЕРЕЛО</a></nav><div class="hiddenStatus" id="status"><span class="statusDot"></span><span id="liveBadge"></span><span id="alertStatus"></span><span id="alertDetails"></span><span id="lastChecked"></span></div><script>
(function(){
const endpoint='https://tryvoha.online/api/v1/alerts';
const badge=document.getElementById('liveBadge');
const status=document.getElementById('alertStatus');
const details=document.getElementById('alertDetails');
const dot=document.querySelector('#status .statusDot');
const checked=document.getElementById('lastChecked');
function show(label,description,color,tag){
 const mapText=document.getElementById("mapAlertText");const mapDot=document.getElementById("mapAlertDot");const mapFrame=document.getElementById("liveMapFrame");const mapOverlay=document.getElementById("mapAlertOverlay");if(window.updateRegionMapStatus)window.updateRegionMapStatus(color);if(mapText&&mapDot&&mapFrame&&mapOverlay){mapText.textContent=label;mapDot.style.background=color;mapDot.style.boxShadow="0 0 0 5px "+color+"33";mapFrame.style.borderColor=color;mapOverlay.style.borderLeftColor=color;}
 status.textContent=label;details.textContent=description;badge.textContent=tag;status.style.color=color;badge.style.color=color;badge.style.backgroundColor=color+'22';
 dot.style.borderColor=color;dot.style.boxShadow='0 0 0 7px '+color+'22';
}
async function refresh(){
 try{
  const response=await fetch(endpoint,{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  if(!data||!Array.isArray(data.alerts))throw Error('Некоректні дані');
  const alerts=data.alerts;
  if(window.updateUkraineAlerts)window.updateUkraineAlerts(alerts);
  const local=alerts.filter(a=>/обухівськ/i.test(a.name_uk||'')||/obukh/i.test(a.slug||''));
  const oblast=alerts.filter(a=>(a.slug==='kyivska'||/київська область/i.test(a.name_uk||''))&&a.type!=='district');
  const active=local.length?local:oblast;
  const time=data.updated_at?new Date(data.updated_at):new Date();
  if(isNaN(time.getTime()))throw Error('Некоректний час');
  const age=Date.now()-time.getTime();
  if(age>15*60*1000)throw Error('Застарілі дані');
  checked.textContent=time.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Kyiv'});
  if(active.length){
   const levels=active.map(a=>String(a.level||'').toLowerCase());
   const red=levels.includes('red');
   const yellow=levels.includes('yellow');
   const title=red?'ПОВІТРЯНА ТРИВОГА':yellow?'ДРОНОВА ЗАГРОЗА':'ПОВІТРЯНА ТРИВОГА';
   const color=red?'#f45b64':yellow?'#f5c542':'#f45b64';
   const desc=red?'Оголошено повітряну тривогу для Обухівського району або Київської області. Червоний рівень не уточнює тип загрози. Прямуйте до укриття.':yellow?'Повідомляється про загрозу БпЛА для Обухівського району або Київської області. Прямуйте до укриття.':'Тип загрози не уточнено джерелом. Оголошена повітряна тривога для Обухівського району або Київської області. Прямуйте до укриття.';
   show(title,desc,color,'● АКТИВНА ТРИВОГА');
  }else{
   show('ТРИВОГИ НЕ ЗАФІКСОВАНО','За останніми отриманими даними, активної офіційної тривоги для Обухівського району чи всієї Київської області немає. Перевіряйте державні сповіщення.','#43c98b','● ДАНІ ОНОВЛЕНО');
  }
 }catch(e){
  if(window.updateUkraineAlerts)window.updateUkraineAlerts(null);
  show('СТАТУС НЕДОСТУПНИЙ','Не вдалося отримати актуальні дані. Це не означає відсутності загрози. Перевірте офіційні сповіщення.','#8d9bb0','НЕМАЄ ДАНИХ');
 }
}
refresh();setInterval(refresh,60000);
})();
</script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(function(){
 const node=document.getElementById('regionMap');if(!node||!window.L)return;
 const map=L.map(node,{zoomControl:true,scrollWheelZoom:false,minZoom:5,maxZoom:12,attributionControl:true}).setView([48.7,31.4],6);
 map.getContainer().style.background='#10151c';
 const base='https://cdn.jsdelivr.net/gh/darmat1/ukraine-geo-data@main/geodata/';
 let oblasts=null,district=null,currentColor='#8d9bb0',latestAlerts=null;let rayonLayers=[];
 const colors={off:'#273345',red:'#a82d39',yellow:'#c69a24',partial:'#b87631',unknown:'#394555'};
 const normalize=s=>String(s||'').toLowerCase().replace(/[^а-яіїєґa-z]/g,'').replace(/(область|oblast|region)$/,'');
 const keys={'вінницька':'vinnytska','волинська':'volynska','дніпропетровська':'dnipropetrovska','донецька':'donetska','житомирська':'zhytomyrska','закарпатська':'zakarpatska','запорізька':'zaporizka','іванофранківська':'ivano-frankivska','київська':'kyivska','кіровоградська':'kirovohradska','луганська':'luhanska','львівська':'lvivska','миколаївська':'mykolaivska','одеська':'odeska','полтавська':'poltavska','рівненська':'rivnenska','сумська':'sumska','тернопільська':'ternopilska','харківська':'kharkivska','херсонська':'khersonska','хмельницька':'khmelnytska','черкаська':'cherkaska','чернівецька':'chernivetska','чернігівська':'chernihivska','аркрим':'krym','крим':'krym'};
 const oblastKey=p=>{const n=normalize(label(p));return keys[n]||null;};
 function alertColor(k){if(!latestAlerts)return colors.unknown;const group=latestAlerts.filter(a=>a.slug===k||a.oblast_slug===k);if(!group.length)return colors.off;const levels=group.map(a=>a.level);return levels.includes('red')?colors.red:levels.includes('yellow')?colors.yellow:colors.partial;}
 function paintOblasts(){if(!oblasts)return;oblasts.eachLayer(l=>{const k=oblastKey(l.feature.properties||{});const c=k?alertColor(k):colors.unknown;l.setStyle({fillColor:c});l.bindTooltip(label(l.feature.properties||{})+(latestAlerts?(k?(c===colors.off?' · Відбій / немає активної тривоги':c===colors.red?' · Повітряна тривога':c===colors.yellow?' · Дронова загроза':' · Часткова тривога'):' · Дані не зіставлено'):' · Дані недоступні'),{sticky:true});});}
 window.updateUkraineAlerts=function(alerts){latestAlerts=alerts;paintOblasts();paintRayons();const legend=document.querySelector('.ukMapLegend');if(legend)legend.textContent=alerts?'🔴 Тривога  🟡 Дронова загроза  🟠 Часткова  ⚫ Відбій  ·  Оновлення щохвилини':'⚪ Дані недоступні — перевірте офіційні сповіщення';};
 const ukBounds=L.latLngBounds([[44.0,21.5],[52.5,40.6]]);
 map.fitBounds(ukBounds,{padding:[12,12]});
 
 const info=L.control({position:'bottomleft'});info.onAdd=function(){const d=L.DomUtil.create('div','ukMapLegend');d.textContent='Завантажуємо актуальні статуси областей…';return d;};info.addTo(map);
 window.updateRegionMapStatus=function(color){currentColor=color;if(district)district.setStyle({color:color,fillColor:color,fillOpacity:color==='#3dcc86'?.3:.6,weight:2.5});};
 async function load(url){const r=await fetch(url);if(!r.ok)throw Error('Помилка геоданих');return r.json();}
 function label(p){return p.name_uk||p.name_ua||p.name||p.NAME||p.NAME_UK||p.nameUk||p.title||p.oblast_name||'Область';}
 function features(g){return g.type==='FeatureCollection'?g.features:g.type==='Feature'?[g]:[];}
  

 const translit={'а':'a','б':'b','в':'v','г':'h','ґ':'g','д':'d','е':'e','є':'ye','ж':'zh','з':'z','и':'y','і':'i','ї':'yi','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ь':'','ю':'yu','я':'ya','ʼ':'','\'':''};
 const toSlug=s=>Array.from(String(s||'').toLowerCase()).map(c=>translit[c]!==undefined?translit[c]:c).join('').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
 const normalizeDistrict=s=>normalize(s).replace(/район$/,'');
 function rayonStatus(feature,oblastSlug){
  if(!latestAlerts)return {color:colors.unknown,label:'Дані недоступні'};
  const p=feature.properties||{},n=normalizeDistrict(label(p));
  const specific=latestAlerts.filter(a=>{
   const an=normalizeDistrict(a.name_uk||a.name||'');
   return (a.type==='district'||/район/i.test(a.name_uk||''))&&an&&n&&(an===n||an.includes(n)||n.includes(an));
  });
  const regional=latestAlerts.filter(a=>a.slug===oblastSlug||a.oblast_slug===oblastSlug);
  const chosen=specific.length?specific:regional;
  if(!chosen.length)return {color:colors.off,label:'Активної тривоги не зафіксовано'};
  const levels=chosen.map(a=>String(a.level||'').toLowerCase());
  return {color:levels.includes('red')?colors.red:levels.includes('yellow')?colors.yellow:colors.partial,label:specific.length?'Районна тривога':'Обласна тривога'};
 }
 function paintRayons(){
  rayonLayers.forEach(({layer,slug})=>layer.eachLayer(l=>{
   const st=rayonStatus(l.feature,slug);
   l.setStyle({fillColor:st.color,fillOpacity:.9,color:'#111a27',weight:1,opacity:.95});
   l.bindTooltip(label(l.feature.properties||{})+' · '+st.label,{sticky:true});
  }));
  if(district){district.bringToFront();district.setStyle({fillColor:currentColor,color:currentColor,fillOpacity:.12,weight:2.5});}
 }
 async function loadRayons(oblastFeatures){
  const results=await Promise.allSettled(oblastFeatures.map(async f=>{
   const name=label(f.properties||{}),slug=toSlug(name),oblastSlug=oblastKey(f.properties||{});
   if(!slug||!oblastSlug)return;
   const geo=await load(base+slug+'.geojson');
   if(!features(geo).length)return;
   const layer=L.geoJSON(geo,{style:{fillColor:colors.unknown,fillOpacity:.9,color:'#111a27',weight:1}}).addTo(map);
   rayonLayers.push({layer,slug:oblastSlug});paintRayons();
  }));
  const loaded=results.filter(r=>r.status==='fulfilled').length;
  console.info('Географічні дані районів:',loaded,'/',results.length);
 }
 const cities=[
  ['Кагарлик',49.8522,30.8092,true],['Київ',50.4501,30.5234],['Буча',50.549,30.219],['Ірпінь',50.5218,30.2506],['Обухів',50.1067,30.6227],['Біла Церква',49.7968,30.1311],['Бориспіль',50.351,30.956],['Бровари',50.511,30.79],['Вишгород',50.584,30.49],['Фастів',50.0767,29.918],['Ржищів',49.97,31.05],['Українка',50.143,30.746],['Васильків',50.178,30.317],['Миронівка',49.66,30.982],['Переяслав',50.066,31.448],['Чернігів',51.498,31.289],['Житомир',50.254,28.659],['Полтава',49.588,34.551],['Харків',49.993,36.23],['Одеса',46.482,30.723],['Львів',49.839,24.03],['Дніпро',48.464,35.046],['Запоріжжя',47.839,35.139],['Черкаси',49.444,32.059],['Суми',50.907,34.799],['Вінниця',49.233,28.468],['Рівне',50.619,26.251],['Луцьк',50.747,25.325],['Тернопіль',49.553,25.594],['Хмельницький',49.422,26.987],['Ужгород',48.62,22.287],['Івано-Франківськ',48.922,24.71],['Чернівці',48.292,25.935],['Кропивницький',48.507,32.262],['Миколаїв',46.975,31.995],['Херсон',46.636,32.617],['Умань',48.748,30.22],['Сміла',49.222,31.887],['Кременчук',49.065,33.41],['Ніжин',51.05,31.88],['Прилуки',50.593,32.387],['Золотоноша',49.668,32.041],['Ковель',51.215,24.709],['Мукачево',48.439,22.718]
 ];
 const cityLayer=L.layerGroup().addTo(map);
 function paintCities(){
  cityLayer.clearLayers();
  const z=map.getZoom();
  cities.forEach(([name,lat,lng,main])=>{
   if(!main&&z<7&&name!=='Київ')return;
   if(!main&&z<8&&!['Київ','Біла Церква','Бориспіль','Бровари','Обухів'].includes(name))return;
   const point=L.circleMarker([lat,lng],{radius:main?6:3.2,color:main?'#ffe48a':'#e6edf6',weight:1,fillColor:main?'#ffbf20':'#d2dce8',fillOpacity:1}).addTo(cityLayer);
   point.bindTooltip(name,{permanent:true,direction:main?'top':'right',offset:main?[0,-5]:[5,0],className:main?'mainCityLabel':'cityNameLabel'});
  });
 }
 map.on('zoomend',paintCities);paintCities();
 async function draw(){
  try{
   const geo=await load(base+'Ukraine.geojson');
   const fs=features(geo);
   if(!fs.length)throw Error('Немає контурів областей');
   oblasts=L.geoJSON(geo,{style:{color:'#3a4757',weight:1,fillColor:'#273345',fillOpacity:1},onEachFeature:(f,l)=>{
    const name=label(f.properties||{});l.bindTooltip(name,{sticky:true});
   }}).addTo(map);
   map.fitBounds(oblasts.getBounds(),{padding:[14,14]});paintOblasts();loadRayons(fs);
   const kyiv=fs.find(f=>/київськ|kyivsk|kievsk/i.test(JSON.stringify(f.properties||{})));
   if(kyiv){L.geoJSON(kyiv,{style:{color:'#e4b63b',weight:2,fillOpacity:0,opacity:.85},interactive:false}).addTo(map);}
  }catch(e){console.warn('Не вдалося завантажити карту областей',e);node.insertAdjacentHTML('beforeend','<div class="mapBoundaryWarning">Не вдалося завантажити межі областей. Спробуйте оновити сторінку.</div>');}
  try{
   const geo=await load(base+'kyyivska_oblast.geojson');
   const fs=features(geo);
   const matched=fs.filter(f=>/обухівськ|obukhiv|obukhov/i.test(JSON.stringify(f.properties||{})));
   if(!matched.length)throw Error('Не знайдено Обухівський район');
   district=L.geoJSON({type:'FeatureCollection',features:matched},{style:{color:currentColor,fillColor:currentColor,weight:2.5,fillOpacity:.55}}).addTo(map);
   district.bindTooltip('Обухівський район · статус за даними моніторингу',{sticky:true});
  }catch(e){console.warn('Межі Обухівського району недоступні',e);}
 }
 draw();
})();
