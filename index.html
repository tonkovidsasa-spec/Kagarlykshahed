 const mapText=document.getElementById("mapAlertText");const mapDot=document.getElementById("mapAlertDot");const mapFrame=document.getElementById("liveMapFrame");const mapOverlay=document.getElementById("mapAlertOverlay");if(window.updateRegionMapStatus)window.updateRegionMapStatus(color);if(mapText&&mapDot&&mapFrame&&mapOverlay){mapText.textContent=label;mapDot.style.background=color;mapDot.style.boxShadow="0 0 0 5px "+color+"33";mapFrame.style.borderColor=color;mapOverlay.style.borderLeftColor=color;}

async function refresh(){
 try{
  const response=await fetch(endpoint,{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  if(!data||!Array.isArray(data.alerts))throw Error('Некоректні дані');
  const alerts=data.alerts;
  if(window.updateUkraineAlerts)window.updateUkraineAlerts(alerts);
  const local=alerts.filter(a=>/обухівськ/i.test(a.name_uk||'')||/obukh/i.test(a.slug||''));
  const oblast=alerts.filter(a=>(a.slug==='kyivska'||/київська область/i.test(a.name_uk||''))&&a.type!=='district');
  const active=local.length?local:oblast;
  const time=data.updated_at?new Date(data.updated_at):new Date();
  if(isNaN(time.getTime()))throw Error('Некоректний час');
  const age=Date.now()-time.getTime();
  if(age>15*60*1000)throw Error('Застарілі дані');
  checked.textContent=time.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Kyiv'});
  if(active.length){
   const levels=active.map(a=>String(a.level||'').toLowerCase());
   const red=levels.includes('red');
   const yellow=levels.includes('yellow');
   const title=red?'ПОВІТРЯНА ТРИВОГА':yellow?'ДРОНОВА ЗАГРОЗА':'ПОВІТРЯНА ТРИВОГА';
   const color=red?'#f45b64':yellow?'#f5c542':'#f45b64';
   const desc=red?'Оголошено повітряну тривогу для Обухівського району або Київської області. Червоний рівень не уточнює тип загрози. Прямуйте до укриття.':yellow?'Повідомляється про загрозу БпЛА для Обухівського району або Київської області. Прямуйте до укриття.':'Тип загрози не уточнено джерелом. Оголошена повітряна тривога для Обухівського району або Київської області. Прямуйте до укриття.';
   show(title,desc,color,'● АКТИВНА ТРИВОГА');
  }else{
   show('ТРИВОГИ НЕ ЗАФІКСОВАНО','За останніми отриманими даними, активної офіційної тривоги для Обухівського району чи всієї Київської області немає. Перевіряйте державні сповіщення.','#43c98b','● ДАНІ ОНОВЛЕНО');
  }
 }catch(e){
  if(window.updateUkraineAlerts)window.updateUkraineAlerts(null);
  show('СТАТУС НЕДОСТУПНИЙ','Не вдалося отримати актуальні дані. Це не означає відсутності загрози. Перевірте офіційні сповіщення.','#8d9bb0','НЕМАЄ ДАНИХ');
 }
}
refresh();setInterval(refresh,60000);
})();
